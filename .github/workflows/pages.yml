name: Deploy dashboard to GitHub Pages

# The dashboard is a static SPA (public/index.html) that loads SQLite via WASM
# in the browser and queries the committed dataset (tools/contrib-dataset/contrib.db).
# This workflow just assembles the two files and publishes them — no build/Python,
# no token, no network needed at deploy time. Refresh data by committing a new
# contrib.db; that push redeploys the site with the new data baked in.

on:
  push:
    branches: [main]
    paths:
      - public/**
      - tools/contrib-dataset/contrib.db
      - .github/workflows/pages.yml
  workflow_dispatch:   # allows manual deploys (e.g. from a feature branch) too

permissions:
  contents: read
  pages: write
  id-token: write

# Only one concurrent deploy; let an in-progress run finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assemble site (SPA + dataset)
        run: |
          mkdir -p _site
          cp tools/contrib-dataset/contrib.db _site/contrib.db
          # Content hash → cache-busting version. The SPA fetches contrib.db?v=<hash>,
          # so browsers refetch the DB only when its bytes change; otherwise the
          # cached copy is reused. (Pages can't set custom headers, but it does send
          # ETag/Last-Modified, so unchanged requests still come back 304.)
          ver=$(sha256sum _site/contrib.db | cut -c1-12)
          sed "s/__DB_VERSION__/$ver/g" public/index.html > _site/index.html
          echo "DB version: $ver"
          ls -la _site

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
