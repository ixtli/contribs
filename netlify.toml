# Netlify configuration for the contribution dashboard.
#
# The dataset lives in tools/contrib-dataset/contrib.db (committed). On deploy,
# Netlify regenerates the self-contained dashboard from that DB with analyze.py
# (pure stdlib Python — no token, no network, no pip install needed) and serves
# the result from public/. A pre-generated public/index.html is also committed,
# so drag-and-drop deploys (no build step) work too.
#
# To refresh the data, re-sync locally and commit the DB:
#   cd tools/contrib-dataset
#   GH_TOKEN=<token> ./contrib.py sync --repos @repos.txt --since 2026-01-01
#   git commit -am "Refresh contribution data"

[build]
  publish = "public"
  command = "python3 tools/contrib-dataset/analyze.py --db tools/contrib-dataset/contrib.db --html public/index.html"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
