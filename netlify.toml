# Netlify configuration for the contribution dashboard.
#
# The dashboard is a single, self-contained HTML file generated by
# tools/contrib-dataset/analyze.py with the dataset baked in as inline JSON.
# There is no build step — Netlify just serves the static `public/` directory.
#
# To regenerate after re-syncing data (see tools/contrib-dataset/README.md):
#   cd tools/contrib-dataset
#   GH_TOKEN=<token> ./contrib.py sync --include-received
#   ./analyze.py --html ../../public/index.html
# then commit public/index.html.

[build]
  publish = "public"
  command = ""

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
